name: talkievoca

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: talkievoca
      POSTGRES_USER: talkievoca
      POSTGRES_PASSWORD: talkievoca_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkievoca -d talkievoca"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.4
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/talkievoca
      SPRING_DATASOURCE_USERNAME: talkievoca
      SPRING_DATASOURCE_PASSWORD: talkievoca_dev
      TALKIEVOCA_OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  opensearch_data:
